[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etelemetry-server"
version = "2.0.0"
description = "etelemetry server — version check telemetry service"
readme = {text = "etelemetry server — version check telemetry service", content-type = "text/plain"}
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "httpx>=0.27",
    "geoip2>=4.8",
    "jinja2>=3.1",
    "starlette-compress>=1.0",
    "pydantic-settings>=2.2",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
    "testcontainers[postgres]>=4.0",
    "pymongo>=4.6",
    "ruff>=0.4",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/etelemetry_server"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
