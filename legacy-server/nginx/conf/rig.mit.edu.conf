# nginx-proxy config on the instance. TLS is terminated at the ALB; nginx listens on
# :80 only and the ALB forwards HTTP to it. The /.well-known/acme-challenge/ location
# serves the certbot webroot so Let's Encrypt HTTP-01 validation works (the ALB :80
# listener redirects to :443, and LE follows the redirect to reach this location).
server {
    listen 80;
    server_name rig.mit.edu;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://server:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    location /et/ {
        rewrite ^/et/(.*)$ /$1 break;
        proxy_pass http://server:80/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_connect_timeout 600;
        proxy_send_timeout    600;
        proxy_read_timeout    600;
        send_timeout          600;
    }
}
