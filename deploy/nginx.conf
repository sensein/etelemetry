# etelemetry nginx reverse proxy
# IP addresses are stripped from access logs for privacy (FR-016)

log_format noip '$time_iso8601 $request_method $uri $status '
               '$body_bytes_sent "$http_user_agent"';

server {
    listen 80;
    server_name _;

    access_log /var/log/nginx/access.log noip;
    error_log /var/log/nginx/error.log warn;

    # Legacy path support — old clients use /et/projects/...
    # Rewrite to strip /et/ prefix for backward compatibility (FR-008)
    location /et/ {
        rewrite ^/et/(.*)$ /$1 break;
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30;
        proxy_send_timeout 30;
        proxy_read_timeout 30;
    }

    # New path — direct access
    location / {
        proxy_pass http://server:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30;
        proxy_send_timeout 30;
        proxy_read_timeout 30;
    }
}
