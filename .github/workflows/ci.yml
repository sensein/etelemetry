name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  SETUPTOOLS_SCM_PRETEND_VERSION: "0.0.0.dev0"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - run: uv run ruff check src/ server/src/ tools/ tests/ server/tests/

  test-client:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv python install ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest tests/unit/ -v --tb=short

  test-server:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: etelemetry
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: etelemetry_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://etelemetry:testpassword@localhost:5432/etelemetry_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v4
      - run: uv python install 3.11
      - run: uv run --python 3.11 --directory server pytest server/tests/unit/ -v --tb=short

  validate-infra:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
      - uses: astral-sh/setup-uv@v4
      - name: Validate OpenTofu
        working-directory: infra
        run: |
          tofu init -backend=false
          tofu validate
          tofu fmt -check -recursive || echo "::warning::OpenTofu files need formatting (run 'tofu fmt -recursive' in infra/)"
      - name: Run IAM policy tests
        run: uv run --with pytest pytest infra/tests/test_iam_policy.py -v
