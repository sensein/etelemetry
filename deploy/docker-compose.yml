services:
  postgres:
    image: postgres:16-alpine
    container_name: et-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etelemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-etelemetry}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etelemetry}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:latest
    container_name: et-geoipupdate
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:?Set MAXMIND_ACCOUNT_ID in .env}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:?Set MAXMIND_LICENSE_KEY in .env}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City
      GEOIPUPDATE_FREQUENCY: 168  # weekly (hours)
    volumes:
      - geoip:/usr/share/GeoIP
    restart: unless-stopped

  server:
    image: ${ECR_IMAGE:-etelemetry-server:latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: et-server
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-etelemetry}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-etelemetry}
      MAXMIND_DB_PATH: /data/GeoLite2-City.mmdb
      ALLOWLIST_PATH: /config/allowlist.yml
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-21600}
      TIME_BUCKET_HOURS: ${TIME_BUCKET_HOURS:-1}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - geoip:/data:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8000/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  caddy:
    image: caddy:alpine
    container_name: et-caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy
    restart: always

volumes:
  pgdata:
  geoip:
  caddy_data:
  caddy_config:
