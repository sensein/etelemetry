[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etelemetry"
version = "2.0.0"
description = "Lightweight telemetry client for checking software version updates"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.20",
    "packaging>=20.0",
    "ci-info>=0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.24",
    "ruff>=0.4",
    "pytest-cov>=4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/etelemetry"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
