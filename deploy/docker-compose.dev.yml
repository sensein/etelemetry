# Local development / testing compose.
# Usage:
#   cp deploy/.env.example deploy/.env   # edit with real values
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# This starts only PostgreSQL and GeoIP updater.
# Run the server locally with:
#   uv run uvicorn etelemetry_server.app:app --reload --port 8000
#
# Or start everything (including server + nginx) with:
#   docker compose -f deploy/docker-compose.yml up -d

services:
  postgres:
    image: postgres:16-alpine
    container_name: et-postgres-dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etelemetry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: ${POSTGRES_DB:-etelemetry}
    volumes:
      - pgdata-dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-etelemetry}"]
      interval: 5s
      timeout: 5s
      retries: 5

  geoipupdate:
    image: ghcr.io/maxmind/geoipupdate:latest
    container_name: et-geoipupdate-dev
    environment:
      GEOIPUPDATE_ACCOUNT_ID: ${MAXMIND_ACCOUNT_ID:-000000}
      GEOIPUPDATE_LICENSE_KEY: ${MAXMIND_LICENSE_KEY:-placeholder}
      GEOIPUPDATE_EDITION_IDS: GeoLite2-City
      GEOIPUPDATE_FREQUENCY: 0  # Run once and exit
    volumes:
      - geoip-dev:/usr/share/GeoIP

volumes:
  pgdata-dev:
  geoip-dev:
